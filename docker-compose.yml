
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/devalraju1996/turbo-test-automation-backend:latest
    ports:
      - "8000:8000"
    depends_on:
      - frontend

  frontend:
    build: ./frontend
    image: ghcr.io/devalraju1996/turbo-test-automation-frontend:latest
    ports:
      - "5173:80"

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
