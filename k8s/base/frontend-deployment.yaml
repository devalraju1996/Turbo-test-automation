
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: turbo-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 700017004782.dkr.ecr.eu-west-2.amazonaws.com/turbo-test-automation-frontend:latest
          ports:
            - containerPort: 80
