
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: turbo-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 700017004782.dkr.ecr.eu-west-2.amazonaws.com/turbo-test-automation-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URL
              value: mongodb://mongodb:27017
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
